<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store API</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🛒 Fake Store Products</h1>

    <h2 class="count"></h2>

    <div class="search-box">

        <input type="text" id="searchInput" placeholder="Search Product">

        <button id="searchBtn">Search</button>

    </div>

    <div class="filter-buttons">

        <button id="all">All Products</button>

        <button id="price">Price > $50</button>

    </div>

    <div class="controls">

        <button id="lowHigh">Low → High</button>

        <button id="highLow">High → Low</button>

    </div>

    <div class="categoryButtons"></div>

    <div class="apicard"></div>

    <script src="script.js"></script>

</body>
</html>
